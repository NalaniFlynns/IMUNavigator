name: Bump App Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Marketing Version'
        required: true
        type: string
      build:
        description: 'Build Number'
        required: true
        type: string

jobs:
  update-version:
    runs-on: macos-latest
    
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Update and Print Versions
        run: |
          CURRENT_VERSION=$(xcrun agvtool what-marketing-version -terse1)
          CURRENT_BUILD=$(xcrun agvtool what-version -terse)
          
          echo "========================================"
          echo "Current Marketing Version: $CURRENT_VERSION"
          echo "Current Build Number: $CURRENT_BUILD"
          echo "========================================"
          
          xcrun agvtool new-marketing-version ${{ inputs.version }}
          xcrun agvtool new-version -all ${{ inputs.build }}
          
          NEW_VERSION=$(xcrun agvtool what-marketing-version -terse1)
          NEW_BUILD=$(xcrun agvtool what-version -terse)
          
          echo "========================================"
          echo "New Marketing Version: $NEW_VERSION"
          echo "New Build Number: $NEW_BUILD"
          echo "========================================"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: bump version to ${{ inputs.version }} (build ${{ inputs.build }})"
          title: "Bump version to ${{ inputs.version }} (build ${{ inputs.build }})"
          body: |
            Automated version bump triggered via GitHub Actions.
            - **New Marketing Version:** ${{ inputs.version }}
            - **New Build Number:** ${{ inputs.build }}
          branch: "chore/bump-version-${{ inputs.build }}"
          base: main
          delete-branch: true
