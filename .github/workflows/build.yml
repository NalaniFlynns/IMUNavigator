name: Build IMUNavigator Unsigned IPA

on:
  push:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-ios:
    # 1. 核心修改：将运行环境升级到最新支持 Xcode 16+ 的 macOS 15 虚拟机
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        # 2. 核心修改：切换到最新的 Xcode 16.x 编译器，完美对齐您的本地高版本环境
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Build Unsigned App
        # 使用 -alltargets 和固定输出目录
        run: |
          xcodebuild build \
            -project IMUNavigator.xcodeproj \
            -configuration Release \
            -sdk iphoneos \
            -alltargets \
            SYMROOT=$(pwd)/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package to IPA
        run: |
          mkdir -p build/Payload
          # 自动抓取编译成功的二进制文件并打包
          cp -r build/Release-iphoneos/*.app build/Payload/ 2>/dev/null || true
          cd build
          zip -r IMUNavigator_Unsigned.ipa Payload/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IMUNavigator-Unsigned-IPA
          path: build/IMUNavigator_Unsigned.ipa
