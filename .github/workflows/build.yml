name: Build iOS IPA (Unsigned)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: macos-14 

    steps:
    - name: 📥 下载代码仓库
      uses: actions/checkout@v4

    - name: 🧩 强制解析并下载 Swift 依赖包
      run: |
        xcodebuild -resolvePackageDependencies \
          -project IMUNavigator/IMUNavigator.xcodeproj \
          -scheme IMUNavigator \
          -destination 'generic/platform=iOS'

    - name: 🏗️ 编译 Xcode 项目
      run: |
        xcodebuild archive \
          -project IMUNavigator/IMUNavigator.xcodeproj \
          -scheme IMUNavigator \
          -destination 'generic/platform=iOS' \
          -archivePath build/IMUNavigator.xcarchive \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          AD_HOC_CODE_SIGNING_ALLOWED=YES

    - name: 📦 打包为 IPA
      run: |
        mkdir -p build/Payload
        cp -r build/IMUNavigator.xcarchive/Products/Applications/IMUNavigator.app build/Payload/
        cd build
        zip -qr IMUNavigator.ipa Payload
      
    - name: 🚀 上传 IPA
      uses: actions/upload-artifact@v4
      with:
        name: IMUNavigator-Release-IPA
        path: build/IMUNavigator.ipa
