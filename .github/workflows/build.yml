name: Build IMUNavigator Unsigned IPA

on:
  push:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Build Unsigned App
        # 核心改动：在 xcodebuild 前面加上和后面带上特定的自动识别参数
        # 移除 -scheme 参数，让服务器像本地一样自己去动态寻找
        run: |
          xcodebuild build \
            -project IMUNavigator.xcodeproj \
            -configuration Release \
            -sdk iphoneos \
            -alltargets \
            SYMROOT=$(pwd)/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package to IPA
        run: |
          mkdir -p build/Payload
          # 自动寻找编译出来的 .app 文件夹（防止由于 target 名字差异导致路径对不上）
          cp -r build/Release-iphoneos/*.app build/Payload/
          cd build
          zip -r IMUNavigator_Unsigned.ipa Payload/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IMUNavigator-Unsigned-IPA
          path: build/IMUNavigator_Unsigned.ipa
