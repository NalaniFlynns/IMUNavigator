name: Build iOS IPA (Unsigned)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: macos-14 

    steps:
    - name: 📥 下载代码仓库
      uses: actions/checkout@v4

    - name: 🏗️ 编译 Xcode 项目 (跳过 Archive 的严格校验)
      run: |
        xcodebuild clean build \
          -project IMUNavigator.xcodeproj \
          -scheme IMUNavigator \
          -sdk iphoneos \
          -configuration Release \
          -derivedDataPath ./build_output \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          AD_HOC_CODE_SIGNING_ALLOWED=YES

    - name: 📦 手动提取并打包为 IPA
      run: |
        mkdir -p build/Payload
        # 直接从 DerivedData 中提取编译好的 .app 目录
        cp -r ./build_output/Build/Products/Release-iphoneos/IMUNavigator.app build/Payload/
        cd build
        zip -qr IMUNavigator.ipa Payload
      
    - name: 🚀 上传 IPA
      uses: actions/upload-artifact@v4
      with:
        name: IMUNavigator-Release-IPA
        path: build/IMUNavigator.ipa
