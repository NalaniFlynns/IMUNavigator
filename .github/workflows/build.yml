name: Build IMUNavigator Unsigned IPA

on:
  push:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Build Unsigned App
        # 针对您的项目名 IMUNavigator 进行了严格的大小写匹配
        # 增加 CODE_SIGNING_ALLOWED=NO 确保灵动岛等扩展组件也自动关闭签名
        run: |
          xcodebuild clean build \
            -project IMUNavigator.xcodeproj \
            -scheme IMUNavigator \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package to IPA
        run: |
          mkdir -p build/Payload
          # 自动寻找编译出的主程序包并复制到打包目录
          cp -r ~/Library/Developer/Xcode/DerivedData/*/Build/Products/Release-iphoneos/IMUNavigator.app build/Payload/ 2>/dev/null || cp -r build/Release-iphoneos/IMUNavigator.app build/Payload/
          cd build
          zip -r IMUNavigator_Unsigned.ipa Payload/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IMUNavigator-Unsigned-IPA
          path: build/IMUNavigator_Unsigned.ipa
