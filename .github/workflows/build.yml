name: Build iOS IPA (Unsigned)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: macos-14 

    steps:
    - name: 📥 獲取代碼
      uses: actions/checkout@v4

    - name: ⚙️ 建立全域無簽名設定 (xcconfig)
      run: |
        # 建立設定檔，強制要求 Xcode 在所有層級放棄尋找開發者憑證與 Entitlements
        echo "CODE_SIGNING_ALLOWED = NO" > disable_signing.xcconfig
        echo "CODE_SIGNING_REQUIRED = NO" >> disable_signing.xcconfig
        echo "CODE_SIGN_IDENTITY = \"\"" >> disable_signing.xcconfig
        echo "ENTITLEMENTS_REQUIRED = NO" >> disable_signing.xcconfig

    - name: 🏗️ 執行純淨編譯 (套用全域設定)
      run: |
        xcodebuild clean build \
          -project IMUNavigator.xcodeproj \
          -scheme IMUNavigator \
          -destination 'generic/platform=iOS' \
          -configuration Release \
          -xcconfig disable_signing.xcconfig \
          -derivedDataPath ./build_output

    - name: 📦 手動提取並封裝 IPA
      run: |
        mkdir -p build/Payload
        # 從 DerivedData 目錄中精準提取編譯好的 .app
        cp -r ./build_output/Build/Products/Release-iphoneos/IMUNavigator.app build/Payload/
        cd build
        zip -qr IMUNavigator.ipa Payload
      
    - name: 🚀 上傳 IPA 產物
      uses: actions/upload-artifact@v4
      with:
        name: IMUNavigator-Release-IPA
        path: build/IMUNavigator.ipa
